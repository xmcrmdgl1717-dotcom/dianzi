<html lang="zh-CN" style=""><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>U8国际</title>
  <!-- 像素 -->

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0b0b0f; /* 全局暗色背景 */
      color: #e2e2e6;
      min-height: 100vh;
      overflow-x: hidden;
    }

    a {
      text-decoration: none;
      color: inherit
    }

    img {
      display: block;
      max-width: 100%
    }

    .page {
      width: 100%;
      background: #0b0b0f;
      min-height: 100vh;
      position: relative;
    }

    /* 顶部导航 */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 20;
      background: linear-gradient(180deg, rgba(11, 11, 15, 0.9) 0%, rgba(11, 11, 15, 0) 100%);
      height: 70px;
      padding: 12px 0;
      color: #fff;
    }

    .header-inner {
      height: 100%;
      max-width: 620px;
      margin: 0 auto;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }

    .header-btn {
      border: 0;
      background: transparent;
      color: #fff;
      cursor: pointer;
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center
    }

    .header-btn img {
      width: 24px;
      height: 24px;
      object-fit: contain;
      filter: brightness(0) invert(1);
    }

    .logo {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      height: 38px;
      width: 210px;
      object-fit: contain;
      filter: brightness(0) invert(1);
    }

    main {
      padding-top: 0;
    }

    /* ===== 顶部全屏视频 ===== */
    .video-hero {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #0b0b0f;
    }

    .video-loader {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 36px;
      height: 36px;
      margin: -18px 0 0 -18px;
      border: 3px solid rgba(149, 117, 205, 0.2);
      border-top-color: #9575cd;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      z-index: 1;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .video-hero video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 2;
      background: transparent;
    }

    .video-hero.ready .video-loader {
      opacity: 0;
    }

    .video-hero .video-overlay {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 25%;
      background: linear-gradient(to top, #0b0b0f 0%, transparent 100%);
      z-index: 3;
      pointer-events: none;
    }

    /* ===== 中间内容容器 ===== */
    .content-section {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
      padding: 0 12px 20px;
      background: #0b0b0f;
      position: relative;
      z-index: 4;
    }

    /* 轮播海报 */
    .slideshow {
      padding: 0 6px;
      margin-top: -20px;
    }

    .slide {
      display: none;
    }

    .slide.active {
      display: block;
    }

    .slide img {
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }

    .dots {
      text-align: center;
      margin: 12px 0 6px
    }

    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin: 0 4px;
      border-radius: 50%;
      background: #333;
      cursor: pointer;
      transition: background .3s;
    }

    .dot.active {
      background: #9575cd;
      width: 20px;
      border-radius: 4px;
    }

    /* 进入网页版按钮 */
    .primary-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 20px 16px;
    }

    .primary-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      width: min(80%, 360px);
      padding: 15px 20px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #9575cd, #6f4bb3);
      box-shadow: 0 4px 15px rgba(149, 117, 205, 0.35);
      color: #fff;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: .2s;
    }

    .primary-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(149, 117, 205, 0.5);
    }

    .primary-button:active {
      transform: scale(.98)
    }

    .primary-button img {
      width: 22px;
      height: 22px;
      object-fit: contain;
      filter: brightness(0) invert(1);
    }

    /* 游戏画廊 */
    .gallery {
      background: #14141a;
      border-radius: 16px;
      padding: 16px 10px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, .3);
      border: 1px solid rgba(255, 255, 255, .04);
      margin-top: 10px;
    }

    .row {
      overflow: hidden;
      margin: 8px 0
    }

    .track {
      display: flex;
      gap: 8px;
      width: max-content;
      animation: marquee 22s linear infinite
    }

    .row.reverse .track {
      animation-direction: reverse
    }

    .row:hover .track {
      animation-play-state: paused
    }

    @keyframes marquee {
      from { transform: translateX(0) }
      to { transform: translateX(calc(-50% - 4px)) }
    }

    .game {
      background: #1c1c24;
      border: 1px solid rgba(255, 255, 255, .04);
      border-radius: 12px;
      min-width: 104px;
      padding: 8px;
      text-align: center;
      cursor: pointer;
      transition: .2s;
    }

    .game:hover {
      background: #252530;
      border-color: rgba(149, 117, 205, .3);
    }

    .game img {
      width: 76px;
      height: 76px;
      object-fit: cover;
      border-radius: 10px;
      margin: auto
    }

    .game .name {
      font-weight: 600;
      font-size: 12px;
      color: #d1d1d6;
      margin-top: 6px
    }

    .game .value {
      font-weight: 700;
      font-size: 15px;
      color: #c9a96e;
      margin-top: 2px
    }

    .game .value.muted {
      color: #6b6b78
    }

    /* 底部 App 下载卡片 */
    .app-download-card {
      background: #14141a;
      border-radius: 16px;
      padding: 16px 12px;
      margin: 16px 0 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, .3);
      border: 1px solid rgba(255, 255, 255, .04);
    }

    .app-download-card > img {
      width: 100%;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    .download-row {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .download-row button {
      border: 0;
      background: transparent;
      padding: 0;
      cursor: pointer;
      width: 50%
    }

    .download-row img {
      width: 100%;
      height: auto;
      border-radius: 8px;
    }

    /* ================= 新增：领奖排行榜样式 ================= */
    .leaderboard {
      background: #14141a;
      border-radius: 16px;
      padding: 16px 12px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, .3);
      border: 1px solid rgba(255, 255, 255, .04);
    }

    .lb-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 12px;
    }

    .lb-title {
      font-size: 18px;
      font-weight: 700;
      color: #c9a96e;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .lb-title::before {
      content: "🏆";
      font-size: 20px;
    }

    .lb-tabs {
      display: flex;
      background: #0b0b0f;
      border-radius: 8px;
      padding: 4px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .lb-tab {
      padding: 6px 14px;
      font-size: 13px;
      color: #8e8e9a;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.3s;
    }

    .lb-tab.active {
      background: linear-gradient(135deg, #9575cd, #6f4bb3);
      color: #fff;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(149, 117, 205, 0.3);
    }

    .lb-list {
      max-height: 380px;
      overflow-y: auto;
      padding-right: 4px;
    }

    /* 自定义滚动条 */
    .lb-list::-webkit-scrollbar {
      width: 4px;
    }
    .lb-list::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.02);
      border-radius: 4px;
    }
    .lb-list::-webkit-scrollbar-thumb {
      background: rgba(149, 117, 205, 0.4);
      border-radius: 4px;
    }

    .lb-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 8px;
      border-radius: 8px;
      margin-bottom: 4px;
      transition: background 0.2s;
    }

    .lb-item:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    .lb-user {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }

    .lb-rank {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      font-size: 14px;
      font-weight: 800;
      color: #6b6b78;
      font-style: italic;
      flex-shrink: 0;
    }

    /* 前三名样式 */
    .lb-item:nth-child(1) .lb-rank { color: #ffd700; font-size: 18px; text-shadow: 0 0 8px rgba(255,215,0,0.4); }
    .lb-item:nth-child(2) .lb-rank { color: #c0c0c0; font-size: 16px; }
    .lb-item:nth-child(3) .lb-rank { color: #cd7f32; font-size: 16px; }
    
    .lb-item:nth-child(1) .lb-name { color: #ffd700; }
    .lb-item:nth-child(2) .lb-name { color: #c0c0c0; }
    .lb-item:nth-child(3) .lb-name { color: #cd7f32; }

    .lb-name {
      font-size: 14px;
      color: #d1d1d6;
      font-family: monospace;
      letter-spacing: 0.5px;
    }

    .lb-amount {
      font-size: 14px;
      font-weight: 700;
      color: #c9a96e;
      text-align: right;
    }

    .lb-amount::before {
      content: "¥";
      font-size: 12px;
      margin-right: 2px;
      opacity: 0.8;
    }

    /* 页脚 */
    .footer {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
      text-align: center;
      padding: 12px 16px 100px;
      color: #5a5a66;
      font-size: 12px;
      background: #0b0b0f;
    }

    /* 底部悬浮操作栏 */
    .bottom-actions {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(16px + env(safe-area-inset-bottom));
      width: calc(100% - 32px);
      max-width: 588px;
      z-index: 50;
      display: flex;
      gap: 10px;
      margin: 0;
      padding: 10px;
      background: rgba(20, 20, 26, 0.95);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, .06);
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, .6);
    }

    .bottom-action {
      position: relative;
      flex: 1;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      padding: 14px 7px;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      line-height: 1;
      background: linear-gradient(135deg, #9575cd, #6f4bb3);
      box-shadow: 0 4px 10px rgba(149, 117, 205, .2);
      transition: transform .18s, filter .18s;
    }

    .bottom-action.download {
      background: linear-gradient(135deg, #d4af37, #b8942e);
      box-shadow: 0 4px 10px rgba(212, 175, 55, .2);
    }

    .bottom-action:hover {
      transform: translateY(-2px);
      filter: brightness(1.1)
    }

    .bottom-action:active {
      transform: scale(.98)
    }

    .bottom-action small {
      position: absolute;
      z-index: 2;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      background: #ee5948;
      padding: 4px 12px;
      border-radius: 10px;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(238, 89, 72, .4)
    }

    .bottom-action small:before {
      content: "";
      position: absolute;
      left: 14px;
      bottom: -4px;
      width: 8px;
      height: 8px;
      background: #ee5948;
      border-radius: 2px;
      transform: rotate(45deg)
    }

    .bottom-action span {
      position: relative;
      z-index: 1
    }

    /* 弹窗样式 */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .7);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
      backdrop-filter: blur(4px);
    }

    .modal-backdrop.show {
      display: flex
    }

    .modal {
      width: min(100%, 400px);
      background: #14141a;
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 16px;
      padding: 26px 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .8);
      position: relative
    }

    .modal h2 {
      font-size: 22px;
      color: #c9a96e;
      margin-bottom: 6px
    }

    .modal p {
      font-size: 13px;
      color: #8e8e9a;
      line-height: 1.6;
      margin-bottom: 18px
    }

    .close {
      position: absolute;
      right: 14px;
      top: 12px;
      border: 0;
      background: none;
      font-size: 24px;
      color: #6b6b78;
      cursor: pointer
    }

    .field {
      margin: 12px 0
    }

    .field label {
      display: block;
      font-size: 13px;
      color: #a1a1aa;
      margin-bottom: 6px
    }

    .field input {
      width: 100%;
      height: 44px;
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 8px;
      padding: 0 12px;
      font-size: 14px;
      outline: none;
      background: #0b0b0f;
      color: #e2e2e6;
      transition: border-color .2s;
    }

    .field input:focus {
      border-color: #9575cd
    }

    .field input::placeholder {
      color: #4a4a55;
    }

    .code-row {
      display: grid;
      grid-template-columns: 1fr 100px;
      gap: 10px
    }

    .code-box {
      display: grid;
      place-items: center;
      background: rgba(149, 117, 205, .1);
      border: 1px solid rgba(149, 117, 205, .3);
      border-radius: 8px;
      color: #c9a96e;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: .12em;
      cursor: pointer;
      user-select: none;
      transition: filter .15s
    }

    .code-box:hover {
      filter: brightness(1.1)
    }

    .code-box.locked {
      cursor: not-allowed;
      background: #1c1c24;
      border-color: #2a2a35;
      color: #4a4a55;
      letter-spacing: .05em
    }

    .submit {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 14px;
      background: linear-gradient(135deg, #9575cd, #6f4bb3);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: .2s;
    }

    .submit:hover {
      filter: brightness(1.1);
    }

    .hint {
      min-height: 20px;
      color: #c45b42;
      font-size: 12px;
      margin-top: 10px
    }

    .hint.ok {
      color: #31884b
    }

    .switch {
      display: block;
      border: 0;
      background: none;
      color: #9575cd;
      font-size: 13px;
      cursor: pointer;
      margin: 16px auto 0
    }

    @media(max-width:420px) {
      .logo {
        width: 180px;
        height: 32px;
      }
      .primary-button {
        width: 85%
      }
      .lb-header {
        flex-direction: column;
        gap: 12px;
        align-items: flex-start;
      }
    }

    @media(prefers-reduced-motion:reduce) {
      .primary-button, .bottom-action, .game, .submit {
        transition: none
      }
    }
  </style>
</head>

  <script>
    // ==========================================
    // 1. 轮播图逻辑
    // ==========================================
    let slideIndex = 0;
    function showSlide(i) { 
      slideIndex = i; 
      document.querySelectorAll('.slide').forEach((el, n) => el.classList.toggle('active', n === i)); 
      document.querySelectorAll('.dot').forEach((el, n) => el.classList.toggle('active', n === i)); 
    } 
    setInterval(() => showSlide((slideIndex + 1) % 3), 5000);

    // ==========================================
    // 2. 游戏画廊逻辑
    // ==========================================
    const games = [['麻将胡了', 'game-mahjong.webp', 'x25000', 0], ['麻将胡了2', 'game-mahjong2.webp', 'x100000', 1], ['赏金女王', 'game-bounty-queen.webp', 'x50000', 0], ['赏金大对决', 'game-bounty-duel.webp', 'x5000', 0], ['寻宝黄金城', 'game-gold-city.webp', 'x100000', 0], ['赏金船长', 'game-bounty-captain.webp', 'x30000', 0], ['亡灵大盗', 'game-undead-thief.webp', 'x25000', 0], ['少林足球', 'game-shaolin-soccer.webp', 'x4000', 0], ['招财喵', 'game-lucky-cat.webp', 'x20000', 0], ['麒麟送宝', 'game-qilin.webp', 'x80000', 1], ['夜醉佳人', 'game-night-beauty.webp', 'x100000', 0], ['双喜临门', 'game-double-joy.webp', 'x100000', 0], ['福运象财神', 'game-elephant-god.webp', 'x100000', 0], ['爱尔兰精灵', 'game-irish-elf.webp', 'x100000', 1], ['寻龙探宝', 'game-dragon-treasure.webp', 'x2500', 0], ['十倍金牛', 'game-golden-bull.webp', 'x2000', 0], ['赢财神', 'game-fortune-god.webp', 'x100000', 0]];
    function renderGames() { ['row1', 'row2', 'row3'].forEach((id, ri) => { const row = document.getElementById(id); if (ri === 1) row.classList.add('reverse'); const track = document.createElement('div'); track.className = 'track'; const half = document.createElement('div'); half.className = 'track-half'; half.style.display = 'flex'; half.style.gap = '8px'; games.slice(ri * 6, ri === 2 ? games.length : ri * 6 + 6).forEach(g => { const el = document.createElement('button'); el.type = 'button'; el.className = 'game'; el.onclick = () => openModal('register'); el.innerHTML = '<img src="assets/source/' + g[1] + '" alt="' + g[0] + '"><div class="name">' + g[0] + '</div><div class="value ' + (g[3] ? '' : 'muted') + '">' + g[2] + '</div>'; half.appendChild(el) }); track.appendChild(half); track.appendChild(half.cloneNode(true)); row.appendChild(track) }); } renderGames();

    // ==========================================
    // 3. 弹窗及验证码逻辑
    // ==========================================
    let mode = 'register', captchaCode = '', captchaLocked = false, captchaTimer = null; 
    function genCaptcha() { const pools = ['ABCDEFGHJKLMNPQRSTUVWXYZ', 'abcdefghjkmnpqrstuvwxyz', '23456789', '@#$%&*!?']; let s = ''; for (let i = 0; i < 6; i++) { const p = pools[i % 3 === 2 ? (i === 4 ? 2 : 3) : i % 3]; s += p[Math.floor(Math.random() * p.length)] } return s } 
    function getCaptcha() { if (captchaLocked) return; captchaCode = genCaptcha(); const box = document.getElementById('captchaCode'); box.textContent = captchaCode; box.classList.remove('locked'); const hint = document.getElementById('formHint'); hint.className = 'hint'; hint.textContent = '验证码已生成，请输入 6 位验证码。' } 
    function lockCaptcha() { captchaLocked = true; const box = document.getElementById('captchaCode'); box.classList.add('locked'); let s = 60; box.textContent = s + 's 后重试'; captchaTimer = setInterval(() => { s--; if (s <= 0) { clearInterval(captchaTimer); captchaTimer = null; captchaLocked = false; box.classList.remove('locked'); box.textContent = '重新获取' } else { box.textContent = s + 's 后重试' } }, 1000) } 
    function resetCaptcha() { if (captchaTimer) { clearInterval(captchaTimer); captchaTimer = null } captchaCode = ''; captchaLocked = false; const box = document.getElementById('captchaCode'); box.classList.remove('locked'); box.textContent = '点击获取' } 
    function openModal(next) { mode = next; renderModal(); document.getElementById('modalBackdrop').classList.add('show'); setTimeout(() => document.getElementById('username').focus(), 30) } 
    function closeModal() { document.getElementById('modalBackdrop').classList.remove('show') } 
    function backdropClose(e) { if (e.target.id === 'modalBackdrop') closeModal() } 
    function switchMode() { openModal(mode === 'register' ? 'login' : 'register') } 
    function renderModal() { const r = mode === 'register'; document.getElementById('modalTitle').textContent = r ? '注册账号' : '登录账号'; document.getElementById('modalSub').textContent = r ? '填写信息完成注册。' : '输入账号密码完成登录。'; document.getElementById('confirmField').style.display = r ? 'block' : 'none'; document.getElementById('phoneField').style.display = r ? 'block' : 'none'; document.getElementById('confirm').required = r; document.getElementById('phone').required = r; document.getElementById('submitBtn').textContent = r ? '注册账号' : '登录账号'; document.getElementById('switchBtn').textContent = r ? '已有账号？前往登录' : '没有账号？注册账号'; document.getElementById('formHint').textContent = ''; resetCaptcha() } 
    function handleSubmit(e) { e.preventDefault(); const hint = document.getElementById('formHint'); hint.className = 'hint'; if (mode === 'register' && document.getElementById('password').value !== document.getElementById('confirm').value) { hint.textContent = '两次输入的密码不一致。'; return } if (!captchaCode) { hint.textContent = '请先点击右侧按钮获取验证码。'; return } if (document.getElementById('captcha').value.trim() !== captchaCode) { hint.textContent = '验证码错误，请等待 60 秒后重新获取。'; document.getElementById('captcha').value = ''; lockCaptcha(); return } hint.className = 'hint ok'; hint.textContent = mode === 'register' ? '注册成功，正在打开登录窗口。' : '登录成功。'; if (mode === 'register') setTimeout(() => openModal('login'), 900) } 
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal() });

    // ==========================================
    // 4. 视频加载及播放兜底
    // ==========================================
    const heroVideo = document.querySelector('.video-hero video');
    const heroSection = document.querySelector('.video-hero');

    if (heroVideo) {
      if (heroVideo.readyState >= 3) {
        heroSection.classList.add('ready');
      } else {
        heroVideo.addEventListener('canplay', function () {
          heroSection.classList.add('ready');
        }, { once: true });
      }

      var p = heroVideo.play();
      if (p && p.catch) {
        p.catch(function () {
          var retry = function () {
            heroVideo.play().catch(function () {});
            document.removeEventListener('touchstart', retry);
            document.removeEventListener('click', retry);
          };
          document.addEventListener('touchstart', retry, { once: true, passive: true });
          document.addEventListener('click', retry, { once: true });
        });
      }
    }

    // ==========================================
    // 5. 领奖排行榜数据与渲染逻辑
    // ==========================================
    // 基于日期的种子，保证同一天内刷新页面数据不变，隔天自动更新
    const today = new Date();
    const seedString = `${today.getFullYear()}-${today.getMonth()+1}-${today.getDate()}`;
    let seed = 0;
    for (let i = 0; i < seedString.length; i++) {
        seed += seedString.charCodeAt(i);
    }

    // 伪随机数生成器
    function seededRandom() {
        let x = Math.sin(seed++) * 10000;
        return x - Math.floor(x);
    }

    // 用户名生成池
    const prefixes = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h', 'i', 'j', 'k', 'l', 'm', 'n', 'o', 'p', 'q', 'r', 's', 't', 'u', 'v', 'w', 'x', 'y', 'z', 'user', 'king', 'vip', 'luck', 'win', 'top', 'boss', 'sun', 'star', 'moon'];
    const suffixes = ['01', '88', '99', '66', '77', '8', '9', '0', 'a', 'b', 'c', 'x', 'y', 'z', '168', '888', '666'];

    function generateUsername() {
        const pLen = Math.floor(seededRandom() * 4) + 2; // 2-5个字符
        const sLen = Math.floor(seededRandom() * 3) + 1; // 1-3个字符
        let p = '';
        let s = '';
        for(let i=0; i<pLen; i++) {
            p += prefixes[Math.floor(seededRandom() * prefixes.length)];
        }
        for(let i=0; i<sLen; i++) {
            s += suffixes[Math.floor(seededRandom() * suffixes.length)];
        }
        return `${p}***${s}`;
    }

    function generateData(type) {
        let data = [];
        let baseMax = 0;
        let baseMin = 0;

        if (type === 'daily') {
            baseMax = 88888;
            baseMin = 500;
        } else if (type === 'weekly') {
            baseMax = 588888;
            baseMin = 5000;
        } else {
            baseMax = 3888888;
            baseMin = 50000;
        }

        for (let i = 0; i < 20; i++) {
            // 使用递减趋势生成金额，确保排名越高金额越大
            let ratio = 1 - (i / 25); 
            let amount = baseMin + (baseMax - baseMin) * ratio * (0.8 + seededRandom() * 0.4);
            // 保留两位小数
            amount = amount.toFixed(2);
            
            data.push({
                name: generateUsername(),
                amount: parseFloat(amount)
            });
        }

        // 按金额从高到低排序
        data.sort((a, b) => b.amount - a.amount);

        // 格式化金额添加千分位
        data.forEach(item => {
            item.formattedAmount = item.amount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        });

        return data;
    }

    function renderLeaderboard(type) {
        const listEl = document.getElementById('lb-list');
        const data = generateData(type);
        let html = '';
        data.forEach((item, index) => {
            let rank = index + 1;
            // 第一名显示皇冠或者特殊图标可以在这里处理，目前用数字
            html += `
                <div class="lb-item">
                    <div class="lb-user">
                        <div class="lb-rank">${rank}</div>
                        <div class="lb-name">${item.name}</div>
                    </div>
                    <div class="lb-amount">${item.formattedAmount}</div>
                </div>
            `;
        });
        listEl.innerHTML = html;
    }

    // 初始化渲染每日榜
    renderLeaderboard('daily');

    // Tab 切换事件
    document.querySelectorAll('.lb-tab').forEach(tab => {
        tab.addEventListener('click', function() {
            // 切换 active 样式
            document.querySelectorAll('.lb-tab').forEach(t => t.classList.remove('active'));
            this.classList.add('active');
            
            // 重新生成数据并渲染
            const type = this.getAttribute('data-type');
            renderLeaderboard(type);
        });
    });
